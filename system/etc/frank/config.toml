# Frank configuration (spec §6). Installed root:frank 0640 — the operator
# CANNOT read or edit this, and has NO tunable knob anywhere: sensitivity is
# root-only, loaded once at startup; there is no IPC command and no Settings
# surface for it (docs/OPEN-QUESTIONS.md §5 — operator has no power over
# Frank, ever).

# Detection sensitivity, 1 (lenient) .. 5 (strict). Root-only.
# 3 (balanced) confirmed by the operator 2026-07-02, with the standing
# direction that Frank moves toward a primarily RULE-BASED overseer (the AI
# layer stays secondary) — see docs/OPEN-QUESTIONS.md §5/§9.
sensitivity = 3

# Daily reset time-of-day (spec §6): resets the visible ledger + Frank's working
# AI context + working escalation memory. Does NOT affect active lockouts.
reset_hour = 4

[enforcement]
# Cross this cumulative escalation weight -> lockout. Severity weights are:
# minor=1, elevated=2, serious=4. With threshold 4: minor gets several warnings,
# serious skips straight to a lockout (spec §6).
warning_threshold = 4

# The ABSOLUTE ceiling on any lockout, in seconds (spec §6). Frank may extend an
# active lockout up to this for severe violations but can NEVER exceed it. It
# always eventually expires. 1800 = 30 min — halved in the rules-refinement
# session (docs/OPEN-QUESTIONS.md §3); this file previously still said 3600
# and, since it overrides the code default, was silently undoing that call.
hard_ceiling_seconds = 1800

# Frank rules — LEGAL / ETHICAL track (spec §6).
#
# Categories + severities below are operator-confirmed (docs/OPEN-QUESTIONS.md
# §3 resolved). Schema + tier model: see security.toml header.
#
# Note on sources: the content rules below include `activity` — the Hub's
# per-action feed (frankd/sources.py `activity()`), which is the primary content
# source on this OS since the TUI is the shell (no `.bash_history`). It carries
# note/file bodies, launched-program names, opened files, and (once wired) chat
# text, so day-to-day user activity IS now classified. The `browser` collector
# (frankd/sources.py `browser()`) is still an unfilled stub — a real
# browser-history/DNS tap is a separate, larger task — so pure in-browser web
# activity that never touches shell/network/activity is not yet covered.

# ── Piracy / copyright infringement ───────────────────────────────────────
# The DRM-circumvention half of this (yt-dlp/youtube-dl + drm/widevine
# keywords) was REMOVED per operator direction — yt-dlp has too many
# legitimate uses (archiving your own streams, downloading Creative Commons
# video) for a tool-name match to be a reliable signal. Only the plain
# torrent-keyword rule remains.
[[rule]]
id = "legal-piracy-indicator"
track = "legal_ethical"
severity = "minor"
description = "Generic indicator of pirated-media acquisition."
patterns = ["\\btorrent\\b", "\\b1080p\\b.*\\b(WEB|BluRay|x264|x265)\\b"]

# ── Adult content ──────────────────────────────────────────────────────────
# Operator-confirmed: serious (immediate whole-machine lockout). Deliberately
# limited to specific, unambiguous site names rather than a generic word like
# "porn" — a bare word match risks a false "serious" full-lockout on something
# totally innocuous (a headline using the word figuratively, etc.), which is a
# much worse failure mode at this severity than under-matching.
[[rule]]
id = "legal-adult-content"
track = "legal_ethical"
severity = "serious"
description = "Adult content site/service indicator."
patterns = [
  "\\bpornhub\\b", "\\bxvideos\\b", "\\bxnxx\\b", "\\bxhamster\\b",
  "\\bredtube\\b", "\\byouporn\\b", "\\bbrazzers\\b", "\\bspankbang\\b",
  "\\bonlyfans\\b",
]
sources = ["browser", "shell", "network", "activity"]

# ── Gambling ────────────────────────────────────────────────────────────────
[[rule]]
id = "legal-gambling"
track = "legal_ethical"
severity = "elevated"
description = "Gambling site/service indicator."
patterns = [
  "\\bdraftkings\\b", "\\bfanduel\\b", "\\bbet365\\b", "\\bpokerstars\\b",
  "\\bsportsbook\\b", "\\bonline\\s+casino\\b",
]
sources = ["browser", "shell", "network", "activity"]

# ── Illegal goods / drugs ──────────────────────────────────────────────────
# Deliberately narrow: bare drug-name keyword matching is extremely
# false-positive prone (news, medical/harm-reduction info, school research,
# TV/film discussion). This targets purchase-intent phrasing and known
# darknet-market names instead, which is a much stronger signal.
[[rule]]
id = "legal-illegal-goods"
track = "legal_ethical"
severity = "minor"
description = "Purchase-intent language for illegal goods/drugs, or a known darknet-market name."
patterns = [
  "\\b(buy|order|score|deal(er)?)\\b.{0,20}\\b(coke|cocaine|heroin|meth|fentanyl|mdma|lsd)\\b",
  "\\bsilk\\s*road\\b", "\\balphabay\\b", "\\bdarknet\\s*market\\b",
  "\\.onion\\b.{0,30}\\b(market|drugs?)\\b",
]
sources = ["browser", "shell", "network", "activity"]

# ── Self-harm-related content ──────────────────────────────────────────────
# Operator-confirmed: OBSERVE only. This deliberately does NOT go through the
# warn/lockout pipeline at all — a punitive lockout during a bad moment would
# be the wrong response, not a helpful one. Findings still land in Frank's
# incidents log (frank-only, full detail) same as everything else; they just
# never produce a warning, a lockout, or any user-visible reaction. Cast a
# slightly wider net than other rules since there's no punitive downside here.
[[rule]]
id = "legal-self-harm-content"
track = "legal_ethical"
severity = "observe"
description = "Self-harm-related search/content indicator. Log-only by design — never enforced."
patterns = [
  "\\bsuicid(e|al)\\b", "\\bself[\\s-]?harm\\b", "\\bself[\\s-]?injur", "\\bkill\\s+myself\\b",
  "\\bways?\\s+to\\s+die\\b",
]
sources = ["browser", "shell", "network", "activity"]

# ── Hate speech / extremism / violent threats ──────────────────────────────
# Only the high-precision half is implemented here: explicit first-person
# violent threats. A broader hate-speech/extremism WORD LIST is intentionally
# NOT authored as a realtime rule — bare keyword lists for that misfire
# constantly on ordinary news, history, and fiction/games content.
# [RESOLVED — AI-layer session] the periodic review the operator asked for
# instead is now wired up: frankd/triage.py's Sifter runs raw shell/browser
# text through a "hate_speech_extremism" content classifier on its own
# interval, and frankd/overseer.py (the Overseer / "main Frank") decides
# whether any sifted observation is worth flagging. See docs/ARCHITECTURE.md
# "Three tiers, one enforcement path" for how that stays bounded by the same
# Enforcer invariants as this file's realtime rules.
[[rule]]
id = "legal-violent-threat"
track = "legal_ethical"
severity = "elevated"
description = "Explicit first-person statement of intent to commit violence."
patterns = [
  "\\bi(\\s*(a|')?m)?\\s*(going\\s*to|gonna|will)\\s+(kill|murder|shoot|stab|bomb)\\b",
  "\\bi\\s+(want|wanna)\\s+to\\s+(kill|murder|shoot|stab)\\b",
]

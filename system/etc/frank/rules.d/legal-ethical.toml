# Frank rules — LEGAL / ETHICAL track (spec §6).
#
# [TODO(approval)] The spec defines this as the "broader concerning content or
# activity" track. What belongs here is highly personal and context-dependent
# — this file intentionally does NOT decide it. The two rules below are
# placeholders that prove the second track works end-to-end; they are NOT a
# considered recommendation of what should be flagged. See
# docs/OPEN-QUESTIONS.md §3 for the actual decision (what categories belong
# here at all, and what a "serious" tier would even mean for this track).
# Schema + tier model: see security.toml header.

[[rule]]
id = "legal-piracy-indicator"
track = "legal_ethical"
severity = "minor"
description = "Generic indicator of pirated-media acquisition."
patterns = ["\\btorrent\\b", "\\b1080p\\b.*\\b(WEB|BluRay|x264|x265)\\b"]

[[rule]]
id = "legal-circumvention-tooling"
track = "legal_ethical"
severity = "elevated"
description = "DRM/paywall circumvention tooling."
patterns = ["\\byoutube-dl\\b", "\\byt-dlp\\b.*\\b(drm|widevine)\\b"]

# Serious-tier legal/ethical patterns are intentionally NOT shipped as guesses.
# This track's serious tier must be authored by the operator with real intent —
# a wrong guess here is worse than an empty slot. [TODO(approval)]

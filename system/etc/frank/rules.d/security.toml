# Frank rules — SECURITY / RESOURCE track (spec §6).
#
# Severities below are operator-confirmed (docs/OPEN-QUESTIONS.md §3 resolved).
#
# Schema (see frankd/rules.py):
#   id         unique string
#   track      "security"
#   severity   "observe" | "minor" | "elevated" | "serious"  (tier model below)
#   patterns   list of regex, matched case-insensitively against event text
#   sources    optional list: shell|process|filesystem|network|browser|activity
#   description frank-only; never shown to the operator
#
# `activity` (the Hub's per-action feed — docs/ARCHITECTURE.md) is added to the
# specific harm-to-SYSTEM rules below so Frank watches what the user launches or
# types in the Hub too, not just a shell that this OS doesn't even have. The
# patterns here are specific enough (tool names, exact destructive forms) that
# extending them to activity text is low-false-positive; broader/nuanced
# harm-to-system judgement is left to the periodic Guardian sift.
#
# Tier -> action (via enforcement.py, adjusted by sensitivity §5):
#   observe   recorded (frank-only) but NEVER warns or locks out
#   minor     accrues several warnings (status bar) before a session lockout
#   elevated  fewer warnings before a session lockout
#   serious   immediate whole-machine lockout, full-screen banner

# ── Remote-payload execution ──────────────────────────────────────────────
[[rule]]
id = "sec-pipe-to-shell"
track = "security"
severity = "serious"
description = "Remote payload piped directly into a shell/script interpreter (classic install-script pattern)."
patterns = [
  "(curl|wget|fetch)\\s+\\S+.*\\|\\s*(sudo\\s+)?(ba|z|da|fi)?sh\\b",
  "(curl|wget|fetch)\\s+\\S+.*\\|\\s*(sudo\\s+)?python[23]?\\b",
  "(curl|wget|fetch)\\s+\\S+.*\\|\\s*(sudo\\s+)?perl\\b",
  "base64\\s+(-d|--decode)\\b.*\\|\\s*(sudo\\s+)?(ba|z|da|fi)?sh\\b",
]
sources = ["shell", "activity"]

# ── Offensive tooling — split from one bucket into four so severity can be
# tuned independently per tool. These were previously lumped together as
# "sec-exploit-tooling" at a single severity, which didn't distinguish a
# dual-use scanner (nmap) from a credential-theft framework (mimikatz).
# Operator confirmed: doesn't recognize/use nmap or raw listeners personally,
# so false-positive tolerance is less of a concern than for a security
# practitioner — elevated (not serious) is still the right default since
# neither is as unambiguous as an exploit framework.
[[rule]]
id = "sec-recon-tooling"
track = "security"
severity = "elevated"
description = "Network reconnaissance / port-scanning tool. Dual-use in general, but the operator has no known legitimate use for it personally."
patterns = ["\\bnmap\\b"]
sources = ["shell", "process", "activity"]

[[rule]]
id = "sec-exploit-framework"
track = "security"
severity = "serious"
description = "Offensive exploitation framework or credential-dumping tool (Metasploit console, Meterpreter payload, Mimikatz) — no everyday legitimate use on a personal machine (operator-confirmed serious)."
patterns = ["\\bmsfconsole\\b", "\\bmeterpreter\\b", "\\bmimikatz\\b"]
sources = ["shell", "process", "activity"]

[[rule]]
id = "sec-attack-tooling"
track = "security"
severity = "elevated"
description = "Automated attack tooling (SQL-injection tester, network login brute-forcer)."
patterns = ["\\bsqlmap\\b", "\\bhydra\\b"]
sources = ["shell", "process", "activity"]

[[rule]]
id = "sec-raw-listener"
track = "security"
severity = "elevated"
description = "Raw listening socket via netcat/ncat/socat — common in reverse-shell setups. Operator has no known legitimate use for it personally."
patterns = ["\\bnc\\b\\s+-l", "\\bncat\\b\\s+-l", "\\bsocat\\b.*\\blisten\\b"]
sources = ["shell", "process", "activity"]

# ── Network C2 indicators ─────────────────────────────────────────────────
[[rule]]
id = "sec-reverse-shell-port"
track = "security"
severity = "serious"
description = "Connection to a common reverse-shell / C2 port. NOTE: port 9001 is a real false-positive risk (Tor ORPort, Portainer, other legitimate services also default to it)."
patterns = [":4444\\b", ":1337\\b", ":9001\\b"]
sources = ["network"]

# ── Credential exposure. The old generic "password\s*=" text match is
# GONE (operator-confirmed) — it fired on any normal dev work (editing a
# config, writing code with a variable called password) with no real signal.
# What's left is narrowly file/key-based, which has a far lower false-positive
# rate: these patterns essentially only match actual credential material.
[[rule]]
id = "sec-credential-files"
track = "security"
severity = "elevated"
description = "Handling of private-key / cloud-credential file material."
patterns = [
  "id_rsa\\b", "id_ed25519\\b", "\\.pem\\b", "AKIA[0-9A-Z]{16}",
  "-----BEGIN [A-Z ]*PRIVATE KEY-----", "\\bAWS_SECRET",
]

# ── Destructive commands ──────────────────────────────────────────────────
[[rule]]
id = "sec-destructive-command"
track = "security"
severity = "serious"
description = "Potentially destructive filesystem/disk command, or a fork bomb — irreversible data loss/crash (operator-confirmed serious)."
patterns = [
  "rm\\s+-rf\\s+/(?!home)",
  "mkfs\\.",
  "dd\\s+if=\\S+\\s+of=/dev/",
  ":\\(\\)\\s*\\{\\s*:\\s*\\|\\s*:\\s*&\\s*\\}\\s*;\\s*:",
]
sources = ["shell", "activity"]

# Runaway resource usage is a resource-track security signal (spec §6). The
# collector (frankd/sources.py) tracks consecutive high-CPU polls per-process
# and emits the __RUNAWAY_CPU__ marker once a process is sustained above
# threshold for a set number of ticks — a brief spike (compiling, encoding)
# should NOT trip this; only a genuinely sustained runaway process should.
# Tune the threshold/duration in the collector, not here (see its constants).
[[rule]]
id = "res-runaway-cpu"
track = "security"
severity = "minor"
description = "Sustained high CPU by a single process (see meta.cpu / meta.pid)."
patterns = ["__RUNAWAY_CPU__"]
sources = ["process"]

# kitty config for the kiosk terminal — CRT phosphor look (spec §2).
# Included by foundationhub-session when launching kitty inside cage. Amber default;
# the Settings > Theme screen can switch palettes at runtime in the TUI.

# --- font: monospace bitmap-style (spec §2) ---
font_family      Terminus
font_size        14.0
disable_ligatures always

# --- amber phosphor palette (default) ---
foreground       #ffb000
background       #060606
cursor           #ffb000
cursor_text_color #060606
selection_foreground #060606
selection_background #ffb000

# Dim/bright variants approximate the phosphor glow.
color0  #0a0a0a
color8  #3a2a00
color1  #ff5030
color9  #ff7050
color2  #ffb000
color10 #ffd060
color3  #ffb000
color11 #ffd060
color7  #ffb000
color15 #fff0c0

# --- kiosk chrome: none (spec §2) ---
hide_window_decorations yes
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no

# --- CRT feel ---
cursor_blink_interval 0.6
cursor_shape block
# (scanline/glow are drawn by the TUI itself; a shader-based bloom is a later
#  pass — spec §11.10. See theme/colors-green.conf for the alt palette.)

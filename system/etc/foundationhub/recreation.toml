# Recreation game list (spec §5). Data, not code — add/remove a game by editing
# this file; the Recreation screen reads it live. Final title list is
# [TODO(approval)] — see docs/OPEN-QUESTIONS.md §2.
#
# Each bucket maps to a genre; each game has a display name and an argv `exec`.

[bucket.roguelikes]
games = [
  { name = "NetHack",        exec = ["nethack"] },
  { name = "Dungeon Crawl",  exec = ["crawl"] },
]

[bucket.arcade]
# One in-house program, five games (BUILD-QUEUE §5 item 1). Retires
# nsnake, vitetris, ninvaders, 2048, and nudoku in one shot.
games = [
  { name = "Foundation Arcade", exec = ["foundation-arcade"] },
]

[bucket."puzzle / strategy"]
# Chess is in-house now (BUILD-QUEUE §5 item 2): foundation-chess replaces
# gnuchess — vs. a built-in minimax AI, same CRT register.
games = [
  { name = "Chess",   exec = ["foundation-chess"] },
]

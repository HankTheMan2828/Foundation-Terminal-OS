# Recreation game list (spec §5). Data, not code — add/remove a game by editing
# this file; the Recreation screen reads it live. The list follows the in-house
# mandate (docs/OPEN-QUESTIONS.md §2/§10): in-house games plus the vendored Rogue.
#
# Each bucket maps to a genre; each game has a display name and an argv `exec`.
# Optional `hint` shows to the right of the row; optional `missing_hint` is what
# the Hub prints if the binary isn't installed (used for the downloadable slot).

# Rogue. The 1981 original (rogue3.6 -> "rogue") is the one vendored game we
# ship (feedback #2: a real upstream binary, not an in-house build; see
# vendor/rogue3.6, install/packages.txt).
#
# "Rogue (1985)" is a DOWNLOADABLE skeleton, NOT shipped: the graphical DOS/PC
# look the operator wants (docs/ROGUE-DOWNLOADABLE.md) has no redistributable
# upstream to bake into the ISO, so the slot is a not-installed placeholder for
# a user-provided `rogue54` build. NetHack was removed entirely (operator
# direction 2026-07-05). Dungeon Crawl was dropped earlier: `crawl` was never
# in install/packages.txt, so it was a dead menu item on a real install.
[bucket.roguelikes]
games = [
  { name = "Rogue (1981, OG)",  exec = ["rogue"] },
  { name = "Rogue (1985)",      exec = ["rogue54"], hint = "downloadable — not installed", missing_hint = "[ downloadable graphical build — see docs/ROGUE-DOWNLOADABLE.md ]" },
]

[bucket.arcade]
# One in-house program, five games (BUILD-QUEUE §5 item 1). Retires
# nsnake, vitetris, ninvaders, 2048, and nudoku in one shot. Listed
# individually (not nested under a "Foundation Arcade" sub-menu) per
# operator request 2026-07-03 -- each `exec` picks the game directly.
games = [
  { name = "Snake",         exec = ["foundation-arcade", "snake"] },
  { name = "Falling Blocks", exec = ["foundation-arcade", "blocks"] },
  { name = "2048",           exec = ["foundation-arcade", "2048"] },
  { name = "Sudoku",         exec = ["foundation-arcade", "sudoku"] },
  { name = "Invaders",       exec = ["foundation-arcade", "invaders"] },
]

[bucket."puzzle / strategy"]
# Chess is in-house now (BUILD-QUEUE §5 item 2): foundation-chess replaces
# gnuchess — vs. a built-in minimax AI, same CRT register.
games = [
  { name = "Chess",   exec = ["foundation-chess"] },
]

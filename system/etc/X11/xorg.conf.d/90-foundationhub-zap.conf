# Foundation TerminalOS — guaranteed exit from the Web Access Xorg path.
#
# The Xorg fallback runs Firefox with no window manager, so the operator's
# only controls are Firefox's own keyboard UI. If Firefox ever wedges,
# Ctrl+Alt+Backspace kills the X server outright and the Hub reclaims the
# console (foundationhub-web resets the VT on exit). Installed by
# install/04-hub.sh; /etc/X11/xorg.conf.d is honored even when Xorg runs
# with elevated rights, unlike a -configdir under /tmp.
Section "InputClass"
    Identifier "foundationhub-zap"
    MatchIsKeyboard "on"
    Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection

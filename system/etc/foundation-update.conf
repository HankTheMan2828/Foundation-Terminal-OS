# Foundation TerminalOS — update transport policy (docs/UPDATE-SYSTEM.md §3).
# Read at the moment an update is attempted; nothing watches this file and no
# daemon exists. One of:
#   usb                  offline only — updates arrive on the release USB stick
#   usb+wired            USB, or network updates over ethernet only
#   usb+wired+wireless   wireless additionally allowed (explicit opt-in)
#
# Root-owned. Changed from Settings > SYSTEM UPDATE (technician setup code
# required, via the scoped foundation-update helper) — that path also turns
# the WiFi radio on/off to match, so "wired only" is a machine state, not a
# request.
transports = usb+wired

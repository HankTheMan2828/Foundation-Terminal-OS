# Autologin the operator on tty1 (spec §4 — decided this session).
# The operator's login shell is /usr/local/bin/foundationhub-session (set in step 06),
# so autologin drops STRAIGHT into the Home Hub. @OPERATOR@ is substituted by
# install/02-cage-kiosk.sh.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin @OPERATOR@ --noclear %I $TERM

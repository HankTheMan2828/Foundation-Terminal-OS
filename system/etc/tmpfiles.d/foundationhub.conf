# /run/foundationhub — session-published state (docs/USERS.md).
# active-user: which logical account holds the console, written by the Hub at
# login so Frank's collectors can attribute events per user. Names only.
d /run/foundationhub 0755 operator operator -
# activity.log — the Hub's report-only per-action feed the user's session
# appends to and Frank's `activity` collector reads (docs/ARCHITECTURE.md).
# operator writes; frank only needs to read it (0644 world-readable within the
# operator-owned dir). Appending grants the operator no power over Frank.
f /run/foundationhub/activity.log 0644 operator operator -

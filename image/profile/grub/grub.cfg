# GRUB menu for the installer ISO (both BIOS and UEFI boot paths).
# %ARCHISO_LABEL% / %INSTALL_DIR% / %ARCH% are substituted by mkarchiso.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

insmod search_fs_uuid
insmod search_fs_file
insmod search_label

set default=0
set timeout=5
set timeout_style=menu

menuentry "Install Foundation TerminalOS (x86_64)" --class arch --class gnu-linux {
    set gfxpayload=text
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
}

menuentry "Boot existing OS from first disk" --class os {
    set root=(hd1)
    chainloader +1
}

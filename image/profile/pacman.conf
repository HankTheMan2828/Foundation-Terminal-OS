# pacman.conf used by mkarchiso while BUILDING the live environment (it is
# also copied into the live system). Standard Arch repos; the build host's
# mirrorlist is used.
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

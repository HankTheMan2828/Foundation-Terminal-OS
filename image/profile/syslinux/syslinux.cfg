# BIOS boot menu for the installer ISO (UEFI uses grub/grub.cfg — keep the
# entries in step). %ARCHISO_LABEL% / %INSTALL_DIR% / %ARCH% are substituted
# by mkarchiso at build time.
UI menu.c32
MENU TITLE Foundation TerminalOS installer
MENU CLEAR
TIMEOUT 50
DEFAULT install

LABEL install
MENU LABEL Install Foundation TerminalOS (%ARCH%)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL existing
MENU LABEL Boot existing OS from first disk
COM32 chain.c32
APPEND hd0 0

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32

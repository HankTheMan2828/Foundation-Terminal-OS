# kitty config for the zenbook-duo-2024 display stack — CRT phosphor look.
# PROFILE-ONLY: the generic core runs on the kernel VT and has no kitty; this
# is included by this profile's hardware/display-stack when launching kitty
# inside cage. One fixed look: base yellow on near-black (matches the core VT).

# --- font: monospace bitmap-style (spec §2) ---
font_family      Terminus
font_size        14.0
disable_ligatures always

# --- base yellow phosphor palette ---
foreground       #ffff55
background       #060606
cursor           #ffff55
cursor_text_color #060606
selection_foreground #060606
selection_background #ffff55

# Dim/bright variants approximate the phosphor glow.
color0  #0a0a0a
color8  #5f5f2a
color1  #ff5030
color9  #ff7050
color3  #ffff55
color11 #ffffaa

# Accent slots — must match the core VT retune in foundationhub-session so the
# TUI's PAIR_AMBER/COOL/BRIGHT render identically under the profile display
# stack. color2 = light amber (banner + nav), color6 = soft teal (games),
# color7 = cream white (games). Bright twins keep bold text on-hue.
color2  #ffcf70
color10 #ffdf98
color6  #7fdfe0
color14 #a8ecec
color7  #fff0c0
color15 #fff6dc

# --- kiosk chrome: none (spec §2) ---
hide_window_decorations yes
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no

# --- CRT feel ---
cursor_blink_interval 0.6
cursor_shape block
# (scanline/glow are drawn by the TUI itself; a shader-based bloom is a later
#  pass — spec §11.10.)

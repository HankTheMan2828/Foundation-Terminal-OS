[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zenhub"
version = "0.1.0"
description = "The Home Hub — curses login-shell TUI for Zenbook Duo Terminal OS"
requires-python = ">=3.10"
# Deliberately zero runtime dependencies: pure-stdlib curses so the nav
# skeleton runs and is testable anywhere, and so the login shell never fails
# to start because a pip package is missing. Optional integrations (Mistral
# AI Chat) degrade gracefully when their deps/keys are absent.
dependencies = []

[project.optional-dependencies]
aichat = ["requests>=2.28"]  # only needed if AI Chat is enabled with a key

[project.scripts]
zenhub = "zenhub.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zenhub*"]

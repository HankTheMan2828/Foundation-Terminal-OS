# Builds Frank's LOCAL AI runtime — bitnet.cpp's `llama-server` for BitNet
# b1.58 2B4T (i2_s) — and attaches it to a release. The USB creator stages it
# beside the model, so a fully-offline install has a working AI with zero
# on-target building (docs/FRANK-LOCAL-AI.md).
#
# CRITICAL: llama-server is dynamically linked against libllama.so + libggml*.so.
# Shipping the binary alone leaves frank-ai.service crash-looping (missing
# shared objects). We ship a gzipped tarball of binary + libs with RPATH=$ORIGIN.
#
# Separate from build-iso.yml on purpose: bitnet.cpp's build is finicky, so this
# is independently re-runnable via the "Run workflow" button (workflow_dispatch)
# — pick a release tag to attach to — without rebuilding the (slow) ISO.
#
# Built on ubuntu (older glibc) so the binary also runs on the Arch target
# (newer glibc, forward-compatible). NOTE: bitnet.cpp REQUIRES clang for its
# 1-bit kernels — building with gcc fails at compile (CC/CXX below).
name: build-ai-binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the binary to (blank = latest TerminalOS-v*)"
        required: false
  push:
    tags: ["TerminalOS-v*"]

permissions:
  contents: write

jobs:
  bitnet:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the target release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            latest=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases" \
              | jq -r '[.[] | .tag_name | select(startswith("TerminalOS-v"))][0]')
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential git python3 python3-pip jq patchelf
          pip3 install --break-system-packages huggingface_hub || pip3 install huggingface_hub

      - name: Build bitnet.cpp llama-server (BitNet b1.58 2B4T, i2_s)
        env:
          CC: clang            # bitnet.cpp's 1-bit kernels need clang, not gcc
          CXX: clang++
        run: |
          set -e
          git clone --depth 1 --recursive https://github.com/microsoft/BitNet bitnet
          cd bitnet
          # Upstream const-correctness bug: src/ggml-bitnet-mad.cpp:811 inits a
          # non-const int8_t* from a const pointer, which newer clang rejects as
          # an error (its sibling function ~line 906 already uses const). Patch
          # it — the ^whitespace anchor means it can only match the non-const
          # line, never the already-const one, and it's a no-op if fixed upstream.
          sed -i -E 's/^( +)int8_t \* y_col = y \+ col \* by;/\1const int8_t * y_col = y + col * by;/' \
            src/ggml-bitnet-mad.cpp
          pip3 install --break-system-packages -r requirements.txt \
            || pip3 install -r requirements.txt || true
          # Pin the same 2B4T weight the OS ships — the i2_s kernels are generated
          # for this model's dimensions.
          python3 -c "from huggingface_hub import snapshot_download; \
            snapshot_download('microsoft/BitNet-b1.58-2B-4T-gguf', local_dir='models/BitNet-b1.58-2B-4T')"
          # On any failure, surface the compile log so the run is diagnosable.
          python3 setup_env.py -md models/BitNet-b1.58-2B-4T -q i2_s || {
            echo '=== logs/compile.log ==='; cat logs/compile.log 2>/dev/null || true; exit 1; }
          test -x build/bin/llama-server

          # Bundle binary + private shared libs. install/11 extracts this into
          # /usr/local/lib/foundation-ai/ (RPATH=$ORIGIN so systemd needs no
          # LD_LIBRARY_PATH for the private .so files).
          STAGE="$GITHUB_WORKSPACE/foundation-ai-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          install -m 0755 build/bin/llama-server "$STAGE/llama-server"
          # Collect every libllama / libggml (and versioned siblings) the tree built.
          while IFS= read -r -d '' lib; do
            cp -a "$lib" "$STAGE/"
          done < <(find build -type f \( \
              -name 'libllama.so*' -o -name 'libggml*.so*' \
            \) -print0 2>/dev/null)
          # Also copy anything sitting next to llama-server (some builds put .so here).
          shopt -s nullglob
          for f in build/bin/*.so build/bin/*.so.*; do
            cp -a "$f" "$STAGE/"
          done
          shopt -u nullglob

          # Point the binary at libs shipped beside it.
          if command -v patchelf >/dev/null 2>&1; then
            patchelf --set-rpath '$ORIGIN' "$STAGE/llama-server" || true
            for so in "$STAGE"/lib*.so*; do
              [[ -f "$so" ]] || continue
              patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
            done
          fi

          # Sanity: we must ship more than the naked binary.
          so_count=$(find "$STAGE" -maxdepth 1 -name 'lib*.so*' | wc -l)
          echo "bundled shared libs: $so_count"
          ls -la "$STAGE"
          if [[ "$so_count" -lt 1 ]]; then
            echo "ERROR: no libllama/libggml shared objects found — binary alone will not run"
            # Still package so we can inspect, but fail the job.
            ldd "$STAGE/llama-server" || true
            exit 1
          fi
          ldd "$STAGE/llama-server" || true

          tar -C "$STAGE" -czf "$GITHUB_WORKSPACE/foundation-ai-runtime-x86_64.tar.gz" .
          # Keep the bare binary asset name for older USB creators / debugging.
          install -m 0755 "$STAGE/llama-server" \
            "$GITHUB_WORKSPACE/foundation-ai-llama-server-x86_64"
          # Preferred asset the USB creator looks for first:
          cp -a "$GITHUB_WORKSPACE/foundation-ai-runtime-x86_64.tar.gz" \
            "$GITHUB_WORKSPACE/foundation-ai-llama-server-x86_64.tar.gz"

      - name: Checksum
        run: |
          sha256sum foundation-ai-runtime-x86_64.tar.gz \
            > foundation-ai-runtime-x86_64.tar.gz.sha256
          sha256sum foundation-ai-llama-server-x86_64.tar.gz \
            > foundation-ai-llama-server-x86_64.tar.gz.sha256
          sha256sum foundation-ai-llama-server-x86_64 \
            > foundation-ai-llama-server-x86_64.sha256

      - name: Attach runtime to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            foundation-ai-runtime-x86_64.tar.gz
            foundation-ai-runtime-x86_64.tar.gz.sha256
            foundation-ai-llama-server-x86_64.tar.gz
            foundation-ai-llama-server-x86_64.tar.gz.sha256
            foundation-ai-llama-server-x86_64
            foundation-ai-llama-server-x86_64.sha256

# Builds the flashable installer ISO (image/build-iso.sh) so nobody ever
# needs an Arch machine: CI runs archiso inside an Arch container and
# publishes the result.
#
#   - every manual run ("Run workflow" button) uploads the ISO as a build
#     artifact you can download from the run page
#   - pushing a tag like TerminalOS-v0.0.1 (the operator's release naming
#     convention) additionally creates a GitHub Release with the ISO, its
#     SHA256SUMS, and the USB-creator programs attached — that release page
#     is the end-user download, see tools/usb-creator/README.md
name: build-iso

on:
  workflow_dispatch:
    inputs:
      slim:
        description: "Slim dev ISO: skip the offline package repo (small + fast; the target machine then needs network to install)"
        type: boolean
        default: false
  push:
    tags: ["TerminalOS-v*"]

permissions:
  contents: write # release creation

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # mkarchiso/pacstrap need real mounts
    steps:
      - name: Install build tools
        # grub: mkarchiso's uefi.grub boot mode runs grub-install on the host
        # jq: the stale-asset prune step below
        run: pacman -Syu --noconfirm archiso grub git jq

      - uses: actions/checkout@v4

      # Two pacman caches survive between runs: the host cache (feeds the
      # tool install above and mkarchiso's own pacstrap, which runs with -c)
      # and the offline-repo cache (build-iso.sh pre-seeds its download from
      # FOUNDATION_PKG_CACHE). Arch is rolling, so the run_id key means every
      # run saves a fresh copy and the next one restores the newest.
      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/pacman/pkg
            /var/cache/foundation-pkgs
          key: pacman-pkgs-${{ github.run_id }}
          restore-keys: pacman-pkgs-

      - name: Build the ISO
        env:
          FOUNDATION_PKG_CACHE: /var/cache/foundation-pkgs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./image/build-iso.sh ${{ inputs.slim && '--skip-offline-repo' || '' }}

      - name: Checksums
        run: cd image/out && sha256sum foundation-terminalos-*.iso > SHA256SUMS

      # The network update path (docs/UPDATE-SYSTEM.md §5) downloads a small
      # OS-payload tarball instead of the whole ISO: the same repo tree the
      # ISO embeds, VERSION-stamped. foundation-update on the installed OS
      # looks for exactly `terminalos-payload-<tag>.tar.gz` plus its line in
      # SHA256SUMS. (Signature verification is the pending OPEN-QUESTIONS §12
      # decision; checksum-over-HTTPS until then.)
      - name: Update payload (network-update artifact)
        run: |
          ver="${{ github.ref_name }}"
          mkdir -p /tmp/payload
          git archive --prefix=terminal-os/ HEAD | tar -x -C /tmp/payload
          rm -rf /tmp/payload/terminal-os/image
          printf 'version=%s\nbuilt=%s\n' "$ver" "$(date -u +%Y-%m-%d)" \
            > /tmp/payload/terminal-os/VERSION
          tar -C /tmp/payload -czf "image/out/terminalos-payload-${ver}.tar.gz" terminal-os
          cd image/out && sha256sum "terminalos-payload-${ver}.tar.gz" >> SHA256SUMS

      - name: Upload ISO as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundation-terminalos-iso
          path: |
            image/out/foundation-terminalos-*.iso
            image/out/terminalos-payload-*.tar.gz
            image/out/SHA256SUMS
          if-no-files-found: error

      # A re-cut tag rebuilds with a new date-stamped ISO name, so same-name
      # overwrite never applies — without this prune, every rebuild leaves
      # the previous ISO/payload on the release beside the new one.
      - name: Prune stale release assets (tag builds only)
        if: startsWith(github.ref, 'refs/tags/TerminalOS-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          curl -s -H "Authorization: Bearer $GH_TOKEN" "$api/releases?per_page=100" |
            jq -r --arg tag "${{ github.ref_name }}" \
              '.[] | select(.tag_name == $tag) | .assets[] |
               select(.name | test("^(foundation-terminalos-.*\\.iso|terminalos-payload-.*|SHA256SUMS|foundation-ai-llama-server-.*)$")) |
               "\(.id) \(.name)"' |
            while read -r aid aname; do
              echo "pruning stale asset: $aname ($aid)"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "$api/releases/assets/$aid"
            done
        # (regex also matches the AI server binary the `bitnet` job attaches, so
        # a re-cut tag doesn't leave last build's llama-server on the release)

      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/TerminalOS-v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Foundation TerminalOS installer.

            **To install:** download the ISO plus the USB creator for your
            computer (`FoundationUSBCreator.cmd` + `Create-FoundationUSB.ps1`
            on Windows, `create-foundation-usb.sh` on macOS/Linux), run the
            creator to write a USB stick, then boot the target machine from
            it. Details: `tools/usb-creator/README.md` in the repo.
          files: |
            image/out/foundation-terminalos-*.iso
            image/out/terminalos-payload-*.tar.gz
            image/out/SHA256SUMS
            tools/usb-creator/FoundationUSBCreator.cmd
            tools/usb-creator/Create-FoundationUSB.ps1
            tools/usb-creator/create-foundation-usb.sh

  # Frank's LOCAL AI sensor runs BitNet b1.58 2B4T via bitnet.cpp's llama-server.
  # bitnet.cpp isn't packaged for Arch and an OFFLINE install can't build it, so
  # we build a prebuilt x86_64 binary here and attach it to the release. The USB
  # creator stages it beside the model, so a fully-offline install has a working
  # AI with zero on-target building (docs/FRANK-LOCAL-AI.md). Built on ubuntu
  # (older glibc) so it also runs on the Arch target (newer glibc, forward-compat).
  # [verify-on-CI]: bitnet.cpp's build steps evolve; confirm on the first tag run.
  bitnet:
    runs-on: ubuntu-latest
    needs: iso                         # append to the release the iso job created
    if: startsWith(github.ref, 'refs/tags/TerminalOS-v')
    permissions:
      contents: write
    steps:
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential git python3 python3-pip
          pip3 install --break-system-packages huggingface_hub || pip3 install huggingface_hub

      - name: Build bitnet.cpp llama-server (BitNet b1.58 2B4T, i2_s)
        run: |
          git clone --depth 1 --recursive https://github.com/microsoft/BitNet bitnet
          cd bitnet
          pip3 install --break-system-packages -r requirements.txt \
            || pip3 install -r requirements.txt || true
          # The i2_s kernels are generated for this model's dimensions, so we pin
          # the same 2B4T weight the OS ships and build against it.
          python3 -c "from huggingface_hub import snapshot_download; \
            snapshot_download('microsoft/BitNet-b1.58-2B-4T-gguf', local_dir='models/BitNet-b1.58-2B-4T')"
          python3 setup_env.py -md models/BitNet-b1.58-2B-4T -q i2_s
          test -x build/bin/llama-server
          install -m 0755 build/bin/llama-server \
            "$GITHUB_WORKSPACE/foundation-ai-llama-server-x86_64"

      - name: Checksum
        run: |
          sha256sum foundation-ai-llama-server-x86_64 \
            > foundation-ai-llama-server-x86_64.sha256

      - name: Attach binary to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            foundation-ai-llama-server-x86_64
            foundation-ai-llama-server-x86_64.sha256
